<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Викторина</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #121212;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .quiz {
    text-align: center;
  }
  .question {
    font-size: 2.2rem;
    margin-bottom: 2rem;
  }
  .answers {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
  }
  button {
    font-size: 1.4rem;
    padding: 0.8rem 2rem;
    border: none;
    border-radius: 8px;
    background: #333;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #555;
  }
  .result {
    margin-top: 1.5rem;
    font-size: 1.6rem;
    color: #4caf50;
    min-height: 2rem;
  }
</style>
</head>
<body>
  <div class="quiz">
    <div class="question">Что ты выберешь в бою — меч или магию?</div>
    <div class="answers">
      <button onclick="answer()">Меч</button>
      <button onclick="answer()">Магия</button>
    </div>
    <div class="result" id="result"></div>
  </div>

  <script>
    function answer() {
      document.getElementById('result').textContent = 'Ответ засчитан';
    }
  </script>
</body>
</html>
